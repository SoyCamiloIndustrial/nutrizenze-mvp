{% extends "base.html" %}
{% block title %}Paciente · Vital Trace{% endblock %}
{% block rol %}<span class="rol">Paciente</span>{% endblock %}
{% block content %}
<h1>Vista del paciente</h1>
<p class="sub">Como profesional puedes previsualizar lo que ve cada paciente.</p>
<div class="card">
  {% for p in patients %}
  <p><a class="btn verde" href="{{ url_for('views.patient_summary', patient_id=p.id) }}">{{ p.name }}</a></p>
  {% endfor %}
</div>
{% endblock %}
