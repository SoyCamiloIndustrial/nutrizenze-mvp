<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vital Trace{% endblock %}</title>
  <style>
    :root { --azul:#0A2540; --verde:#10B981; --gris:#F3F4F6; --texto:#1F2937; --suave:#6B7280;
            --ambar:#F59E0B; --rojo:#DC2626; --borde:#E5E7EB; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:var(--texto); line-height:1.5; }
    header { background:var(--azul); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    header a { color:#fff; text-decoration:none; }
    .marca { font-weight:700; font-size:1.1rem; } .marca span { color:var(--verde); }
    .rol { font-size:.85rem; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:999px; }
    main { max-width:1040px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:1.5rem; margin:0 0 4px; color:var(--azul); } h2 { font-size:1.15rem; color:var(--azul); margin:0 0 12px; }
    .sub { color:var(--suave); margin:0 0 20px; }
    .card { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:20px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; font-size:.95rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--borde); }
    th { color:var(--suave); font-weight:600; font-size:.8rem; text-transform:uppercase; letter-spacing:.03em; }
    td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .scroll { overflow-x:auto; }
    .btn { display:inline-block; background:var(--azul); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:.95rem; text-decoration:none; cursor:pointer; }
    .btn.verde { background:var(--verde); } .btn.linea { background:#fff; color:var(--azul); border:1px solid var(--azul); }
    .btn.peq { padding:6px 10px; font-size:.85rem; }
    .chip { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.8rem; font-weight:600; }
    .ok { background:#D1FAE5; color:#065F46; } .atencion { background:#FEF3C7; color:#92400E; } .alto { background:#FEE2E2; color:#991B1B; }
    .info { background:#E0E7FF; color:#3730A3; } .media { background:#FEF3C7; color:#92400E; } .alta { background:#FEE2E2; color:#991B1B; }
    .alerta { border-left:4px solid var(--suave); padding:10px 14px; margin:8px 0; background:var(--gris); border-radius:0 8px 8px 0; }
    .alerta.alta { border-color:var(--rojo); } .alerta.media { border-color:var(--ambar); } .alerta.info { border-color:#6366F1; }
    .alerta.alta, .alerta.media, .alerta.info { color:var(--texto); background:var(--gris); }
    .aviso { font-size:.85rem; color:var(--suave); }
    a { color:var(--azul); }
    textarea, input[type=text] { width:100%; padding:10px; border:1px solid var(--borde); border-radius:8px; font:inherit; }
    .fila { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('views.portal') }}" class="marca">Vital <span>Trace</span></a>
    {% block rol %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
